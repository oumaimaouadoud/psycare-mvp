services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: psycare
      POSTGRES_USER: psycare
      POSTGRES_PASSWORD: psycare
    ports:
      - "5432:5432"
    volumes:
      - psycare_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psycare -d psycare"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgresql://psycare:psycare@db:5432/psycare?schema=public
      CLINIC_TIMEZONE: Africa/Casablanca
      JWT_SECRET: CHANGE_ME_IN_PRODUCTION_1234567890
      ADMIN_EMAIL: admin@cabinet.local
      ADMIN_PASSWORD: ChangeMeNow123!
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  psycare_db:
